name: GQL Hashes

on:
  schedule:
    # Twice daily — catch Twitch hash rotations quickly
    - cron: "17 6,18 * * *"
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "constants.py"
      - "gql_overrides.json"
      - "gql_overrides.py"
      - "scripts/check_gql_hashes.py"
      - ".github/workflows/gql-hashes.yml"
  pull_request:
    paths:
      - "constants.py"
      - "gql_overrides.json"
      - "gql_overrides.py"
      - "scripts/check_gql_hashes.py"
      - ".github/workflows/gql-hashes.yml"

env:
  PYTHON_VERSION: "3.10"

jobs:
  check-gql-hashes:
    name: Check GQL hashes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install aiohttp

      - name: Validate gql_overrides.json
        run: python -m json.tool gql_overrides.json > /dev/null

      - name: Probe Twitch persisted-query hashes
        run: python scripts/check_gql_hashes.py
